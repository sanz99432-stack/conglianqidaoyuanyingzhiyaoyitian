<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>练气到元婴只要一天</title><link rel="icon" type="image/png" sizes="256x256" href="assets/app-icon-256.png"><link rel="apple-touch-icon" href="assets/app-icon.png"><meta name="application-name" content="练气到元婴只要一天"><meta name="theme-color" content="#102b25">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#080f17;color:#dbd9cb;font-family:system-ui,sans-serif}body{display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#233c37,#080f17 70%)}canvas{display:block;touch-action:none;box-shadow:0 24px 100px #0008;image-rendering:pixelated}aside{position:absolute;left:calc(50% + 245px);width:220px}aside b{font-size:20px;color:#e3c990;line-height:1.7}aside p{font-size:13px;line-height:1.9;color:#87968e}aside small{color:#77b9a2}@media(max-width:950px){aside{display:none}}
</style></head><body><canvas id="game" aria-label="像素修仙割草游戏"></canvas><aside><small>云隐宗</small><p><b>练气到元婴<br>只要一天</b></p></aside>
<script src="config.js"></script><script src="src/engine.js"></script><script src="src/balance.js"></script><script src="src/presentation.js"></script><script src="src/audio.js"></script><script src="src/progression.js"></script><script src="src/world.js"></script><script src="src/ui.js"></script><script src="src/content.js"></script><script src="src/polish.js"></script><script src="src/exploration.js"></script><script src="src/expansion.js"></script><script src="assets/ui-layout.js"></script><script src="src/theme.js"></script><script src="src/biome-effects.js"></script><script src="src/mechanics.js"></script><script src="src/motion.js"></script><script src="src/refinements.js"></script><script src="src/clarity.js"></script><script src="src/ascended-combat.js"></script><script src="src/approved-art.js"></script><script src="src/quality.js"></script><script>
XiuxianBalance.install(Xiuxian.Game);XiuxianPresentation.install(Xiuxian.Game);XiuxianProgression.install(Xiuxian.Game,Xiuxian.SKILLS);XiuxianWorld.install(Xiuxian.Game);XiuxianUI.install(Xiuxian.Game,Xiuxian.SKILLS,Xiuxian.STAGES,XiuxianProgression.RELICS);XiuxianContent.install(Xiuxian.Game,Xiuxian.SKILLS,XiuxianProgression.RELICS);XiuxianPolish.install(Xiuxian.Game,Xiuxian.SKILLS,Xiuxian.STAGES,XiuxianProgression.RELICS);
XiuxianExploration.install(Xiuxian.Game,Xiuxian.SKILLS,XiuxianProgression.RELICS,XiuxianWorld.OBJECTS);
XiuxianExpansion.install(Xiuxian.Game);
XiuxianTheme.install(Xiuxian.Game);
XiuxianBiomeEffects.install(Xiuxian.Game);
XiuxianMechanics.install(Xiuxian.Game);
XiuxianMotion.install(Xiuxian.Game);
XiuxianRefinements.install(Xiuxian.Game,Xiuxian.SKILLS,XiuxianProgression.RELICS,XiuxianExploration.BUFFS);
XiuxianClarity.install(Xiuxian.Game,XiuxianExpansion.GEAR);
XiuxianAscendedCombat.install(Xiuxian.Game);XiuxianApprovedArt.install(Xiuxian.Game);XiuxianQuality.install(Xiuxian.Game,XiuxianPresentation.SHEETS,XiuxianProgression.RELICS,XiuxianExpansion.GEAR);
const canvas=document.getElementById('game');let game;
function resize(){const h=Math.min(innerHeight,900),w=Math.min(innerWidth,h*0.5625);canvas.style.width=w+'px';canvas.style.height=h+'px';canvas.width=w*Math.min(devicePixelRatio,2);canvas.height=h*Math.min(devicePixelRatio,2);if(game){game.width=w;game.height=h;}}
resize();const audio=new XiuxianAudio.AudioManager(()=>new Audio());
game=new Xiuxian.Game(canvas,{width:parseFloat(canvas.style.width),height:parseFloat(canvas.style.height),platform:'browser',audio,storage:{get:()=>{try{return JSON.parse(localStorage.getItem('xiuxian-save-v1'))}catch(e){return null}},set:v=>localStorage.setItem('xiuxian-save-v1',JSON.stringify(v))},ad:done=>game.mockAd(done)});
const point=e=>{const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,id:e.pointerId,pointerType:e.pointerType}};
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);game.pointerDown(point(e))});canvas.addEventListener('pointermove',e=>game.pointerMove(point(e)));canvas.addEventListener('pointerup',e=>game.pointerUp(point(e)));canvas.addEventListener('pointercancel',e=>game.pointerUp(point(e)));
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();game.keys[e.key.toLowerCase()]=true;if(e.key==='Escape')game.pause()});window.addEventListener('keyup',e=>delete game.keys[e.key.toLowerCase()]);window.addEventListener('blur',()=>{game.keys={};game.pause()});document.addEventListener('visibilitychange',()=>{audio.visibility(document.hidden);if(document.hidden)game.pause()});window.addEventListener('resize',resize);
let last=performance.now();function frame(now){game.tick(Math.min((now-last)/1000,.05));last=now;game.render();requestAnimationFrame(frame)}requestAnimationFrame(frame);
window.game=game;
</script></body></html>
