<script>
window.gameLoadUI={lastProgress:Date.now(),count:-1,failed:false,complete:false,showError:function(){if(this.complete)return;this.failed=true;document.getElementById('loading-phase').textContent='灵境暂未连通';document.getElementById('loading-status').textContent='连接中断，请重试';document.getElementById('loading-retry').hidden=false}};
document.getElementById('loading-retry').onclick=function(){if(window.game&&game.retryArt&&game.artFailed){game.retryArt();gameLoadUI.failed=false;this.hidden=true}else location.reload()};
setInterval(function(){if(!gameLoadUI.complete&&!gameLoadUI.failed&&Date.now()-gameLoadUI.lastProgress>20000){document.getElementById('loading-status').textContent='连接较慢，可等待或重试';document.getElementById('loading-retry').hidden=false}},1000);window.addEventListener('error',function(e){if(e.target&&e.target.tagName==='SCRIPT'||e.error)gameLoadUI.showError()},true);
</script><canvas id="game" aria-label="像素修仙割草游戏"></canvas><aside><small>云隐宗</small><p><b>练气到元婴<br>只要一天</b></p></aside>
<script src="config.js"></script><script src="src/engine.js"></script><script src="src/balance.js"></script><script src="src/presentation.js?v=1.14.1"></script><script src="src/audio.js"></script><script src="src/progression.js"></script><script src="src/world.js"></script><script src="src/ui.js"></script><script src="src/content.js"></script><script src="src/polish.js"></script><script src="src/exploration.js"></script><script src="src/expansion.js"></script><script src="assets/ui-layout.js"></script><script src="src/theme.js"></script><script src="src/biome-effects.js"></script><script src="src/mechanics.js"></script><script src="src/motion.js"></script><script src="src/refinements.js"></script><script src="src/clarity.js"></script><script src="src/ascended-combat.js"></script><script src="src/approved-art.js"></script><script src="src/quality.js"></script><script>
XiuxianBalance.install(Xiuxian.Game);XiuxianPresentation.install(Xiuxian.Game);XiuxianProgression.install(Xiuxian.Game,Xiuxian.SKILLS);XiuxianWorld.install(Xiuxian.Game);XiuxianUI.install(Xiuxian.Game,Xiuxian.SKILLS,Xiuxian.STAGES,XiuxianProgression.RELICS);XiuxianContent.install(Xiuxian.Game,Xiuxian.SKILLS,XiuxianProgression.RELICS);XiuxianPolish.install(Xiuxian.Game,Xiuxian.SKILLS,Xiuxian.STAGES,XiuxianProgression.RELICS);
XiuxianExploration.install(Xiuxian.Game,Xiuxian.SKILLS,XiuxianProgression.RELICS,XiuxianWorld.OBJECTS);
XiuxianExpansion.install(Xiuxian.Game);
XiuxianTheme.install(Xiuxian.Game);
XiuxianBiomeEffects.install(Xiuxian.Game);
XiuxianMechanics.install(Xiuxian.Game);

XiuxianAscendedCombat.install(Xiuxian.Game);XiuxianApprovedArt.install(Xiuxian.Game);XiuxianQuality.install(Xiuxian.Game,XiuxianPresentation.SHEETS,XiuxianProgression.RELICS,XiuxianExpansion.GEAR);
const canvas=document.getElementById('game');let game;
function resize(){const h=Math.min(innerHeight,900),w=Math.min(innerWidth,h*0.5625);canvas.style.width=w+'px';canvas.style.height=h+'px';canvas.width=w*Math.min(devicePixelRatio,2);canvas.height=h*Math.min(devicePixelRatio,2);if(game){game.width=w;game.height=h;}}
resize();const audio=new XiuxianAudio.AudioManager(()=>new Audio());
game=new Xiuxian.Game(canvas,{width:parseFloat(canvas.style.width),height:parseFloat(canvas.style.height),platform:'browser',audio,storage:{get:()=>{try{return JSON.parse(localStorage.getItem('xiuxian-save-v1'))}catch(e){return null}},set:v=>localStorage.setItem('xiuxian-save-v1',JSON.stringify(v))},ad:done=>game.mockAd(done)});
const point=e=>{const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,id:e.pointerId,pointerType:e.pointerType}};
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);game.pointerDown(point(e))});canvas.addEventListener('pointermove',e=>game.pointerMove(point(e)));canvas.addEventListener('pointerup',e=>game.pointerUp(point(e)));canvas.addEventListener('pointercancel',e=>game.pointerUp(point(e)));
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();game.keys[e.key.toLowerCase()]=true;if(e.key==='Escape')game.pause()});window.addEventListener('keyup',e=>delete game.keys[e.key.toLowerCase()]);window.addEventListener('blur',()=>{game.keys={};game.pause()});document.addEventListener('visibilitychange',()=>{audio.visibility(document.hidden);if(document.hidden)game.pause()});window.addEventListener('resize',resize);
let last=performance.now(),loadFinished=false;game.initArt();
function updateLoading(){const total=game.artTotal||Object.keys(XiuxianPresentation.SHEETS).length,ready=game.artLoaded||0,percent=Math.floor(ready/Math.max(1,total)*100);if(ready!==gameLoadUI.count){gameLoadUI.count=ready;gameLoadUI.lastProgress=Date.now();if(!gameLoadUI.failed)document.getElementById('loading-retry').hidden=true}document.getElementById('loading-percent').textContent=percent+'%';document.getElementById('loading-fill').style.width=percent+'%';document.getElementById('loading-progress').setAttribute('aria-valuenow',percent);if(game.artFailed){gameLoadUI.showError();return false}if(gameLoadUI.failed)return false;document.getElementById('loading-phase').textContent=percent<35?'聚灵入山':percent<75?'山海渐明':'仙门将启';document.getElementById('loading-status').textContent=percent===100?'灵境已成':'灵气汇聚中';return ready===total}
function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;if(!loadFinished){if(updateLoading()){game.render();loadFinished=true;gameLoadUI.complete=true;document.body.classList.add('game-ready');const screen=document.getElementById('loading-screen');screen.classList.add('finished');screen.setAttribute('aria-hidden','true')}}else{game.tick(dt);game.render()}requestAnimationFrame(frame)}requestAnimationFrame(frame);
window.game=game;
</script></body></html>
